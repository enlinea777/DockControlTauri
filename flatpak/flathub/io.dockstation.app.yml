app-id: io.dockstation.app
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: DockControlTauri

finish-args:
  # Ventana
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Acceso al daemon de Docker (socket local) y a la CLI `docker` del host
  - --filesystem=/run/docker.sock
  - --filesystem=/var/run/docker.sock
  - --filesystem=host
  - --env=PATH=/app/bin:/usr/bin:/run/host/usr/bin
  - --talk-name=org.freedesktop.portal.*
  - --env=WEBKIT_DISABLE_COMPOSITING_MODE=1

modules:
  - name: dockcontrol
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/enlinea777/DockControlTauri/releases/download/v1.2.0/DockControl_1.2.0_amd64.deb
        sha256: 69b2960148a49650f96efc197bb533cc6c6a43056d73491ebbf760e3dc47046f
        only-arches: [x86_64]
      - type: file
        path: io.dockstation.app.metainfo.xml
    build-commands:
      - set -e
      - mkdir deb-extract
      - ( cd deb-extract && ar -x ../DockControl_1.2.0_amd64.deb )
      - tar -C deb-extract -xf deb-extract/data.tar.gz
      - install -Dm755 deb-extract/usr/bin/DockControlTauri /app/bin/DockControlTauri
      - sed -i 's/^Icon=.*/Icon=io.dockstation.app/' deb-extract/usr/share/applications/DockControl.desktop
      - install -Dm644 deb-extract/usr/share/applications/DockControl.desktop /app/share/applications/io.dockstation.app.desktop
      - install -Dm644 deb-extract/usr/share/icons/hicolor/128x128/apps/DockControlTauri.png /app/share/icons/hicolor/128x128/apps/io.dockstation.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/32x32/apps/DockControlTauri.png /app/share/icons/hicolor/32x32/apps/io.dockstation.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/256x256@2/apps/DockControlTauri.png /app/share/icons/hicolor/256x256@2/apps/io.dockstation.app.png
      - install -Dm644 deb-extract/usr/share/icons/hicolor/512x512/apps/DockControlTauri.png /app/share/icons/hicolor/512x512/apps/io.dockstation.app.png
      - install -Dm644 io.dockstation.app.metainfo.xml /app/share/metainfo/io.dockstation.app.metainfo.xml
