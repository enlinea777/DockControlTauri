[package]
name = "dockstation-tauri"
version = "1.2.0"
description = "Administra Docker: contenedores, imágenes, Compose y estadísticas"
authors = ["John Chacón <enlinea777@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dockstation_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DockControlTauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = { version = "0.21.1", features = ["ssl", "chrono"] }
tokio = { version = "1.53.3", features = ["full"] }
serde_yaml = "0.9.34"
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.28.0", features = ["v4"] }
shell-words = "1.1.1"
futures-util = "0.3.34"
tauri-plugin-dialog = "2.8.2"

# SSH transport for Docker hosts (`ssh://`) is Unix-only; the `openssh` crate
# used by bollard's `ssh` feature does not build on Windows.
[target.'cfg(unix)'.dependencies]
bollard = { version = "0.21.1", features = ["ssh"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
